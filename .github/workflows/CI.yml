name: ROS build workflow

on: [push]

jobs:
  ros-o:
    strategy:
      fail-fast: false
      matrix:
        DEB_DISTRO: [22.04, 24.04]
        ARCH: [x64]
        ROS_ONE_VARIANT: [techfak]

    runs-on: ${{ matrix.ARCH == 'x64' && format('ubuntu-{0}', matrix.DEB_DISTRO) }}

    env:
      DEBIAN_FRONTEND: noninteractive
      PIP_BREAK_SYSTEM_PACKAGES: ${{ matrix.DEB_DISTRO == '24.04' && '1' || '' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Free disk space
        run: |
          set -x
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h

      - name: Setup ROS-O deb repository
        shell: bash
        run: |
          set -x
          sudo apt update
          sudo apt install -qq -y ca-certificates git

          if [[ "${{ matrix.DEB_DISTRO }}" == "22.04" ]]; then
            CODE_NAME="jammy"
          elif [[ "${{ matrix.DEB_DISTRO }}" == "24.04" ]]; then
            CODE_NAME="noble"
          fi

          echo "deb [trusted=yes] https://ros.packages.techfak.net ${CODE_NAME}-testing main" \
            | sudo tee /etc/apt/sources.list.d/ros-o-builder.list

          sudo apt update

          # techfak uses proper rosdep (NOT python3-rosdep2)
          sudo apt install -qq -y python3-rosdep
          sudo rosdep init

          export ROSDEP_PACKAGE_MAPPING="yaml https://ros.packages.techfak.net/ros-one.yaml ubuntu"
          echo "${ROSDEP_PACKAGE_MAPPING}" \
            | sudo tee /etc/ros/rosdep/sources.list.d/1-ros-o-builder.list

          rosdep update

      - name: Setup catkin tools
        shell: bash
        run: |
          set -x
          sudo apt install -qq -y \
            python3-pip \
            ros-one-catkin \
            cmake \
            build-essential \
            ros-one-rosbash

          pip3 install --upgrade "catkin-tools>=0.9.5"

      - name: Setup workspace
        shell: bash
        run: |
          source /opt/ros/one/setup.bash
          set -x

          mkdir -p ~/ws/src
          cd ~/ws/src
          ln -sf "${GITHUB_WORKSPACE}" .

          # Install dependencies (ignore source pkgs)
          rosdep install -qq -r -y --from-path . --ignore-src || echo "rosdep returned non-zero"

          # Generate & execute system dependency install script
          PIP_BREAK_SYSTEM_PACKAGES=1 \
            rosdep install -qq --simulate -y \
              --from-path . \
              --ignore-src \
              -t exec -t buildtool_export -t buildtool -t build -t build_export \
            | tee rosdep-install.sh

          sed 's/apt-get install/apt-get -y install/;/install ros-one/s/^/#/;/pip3 install/s/^/#/' \
            rosdep-install.sh | bash -xe

          rm -f rosdep-install.sh

          # Cleanup to save disk
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Compile packages
        shell: bash
        run: |
          source /opt/ros/one/setup.bash
          set -x
          cd ~/ws

          # IMPORTANT: no verbose flags
          catkin build \
            --no-status \
            -s \
            --cmake-args -DCATKIN_ENABLE_TESTING=OFF

          df -h
